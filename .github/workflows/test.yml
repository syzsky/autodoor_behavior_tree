name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          chcp 65001
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout pytest-asyncio httpx

      - name: Run tests
        shell: cmd
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          chcp 65001
          pytest tests/ -v --timeout=120 --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            logs/
            .ai/
          retention-days: 7
