name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install Pillow pyautogui customtkinter requests
    
    - name: Build AutoDoor EXE
      run: |
        pyinstaller --onefile --clean --noconfirm main.py
        Move-Item -Path dist\main.exe -Destination AutoDoor.exe
      working-directory: .
    
    - name: Build AI Assistant EXE
      run: |
        pyinstaller --onefile --clean --noconfirm game_bot_assistant.py
        Move-Item -Path dist\game-bot-assistant.exe -Destination AI_Assistant.exe
      working-directory: .
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AutoDoor_AI_Assistant_v7
        path: |
          AutoDoor.exe
          AI_Assistant.exe
